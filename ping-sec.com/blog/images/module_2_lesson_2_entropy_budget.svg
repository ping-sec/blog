<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 630" width="1140" height="630" role="img" aria-labelledby="ent-title ent-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="ent-title">Figure 1. Measured entropy per fingerprint attribute, and what has changed since</title>
  <desc id="ent-desc">A horizontal bar chart of the bits of entropy that each attribute carried in the 2010 Panopticlick study. The plugin list carried 15.4 bits, the font list 13.9, the user agent string 10.0, screen resolution with colour depth 4.83, and time zone about 3.04. A status column records what has happened to each attribute since. The plugin list has been neutralised by a fixed hardcoded list, the user agent has been reduced and frozen with the detail moved to client hints, and the remaining three still contribute.</desc>

  <rect x="0" y="0" width="1140" height="630" fill="#ffffff"/>

  <text x="570" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Figure 1: The Entropy Budget, and How It Shifted</text>
  <text x="570" y="72" text-anchor="middle" font-size="14.5" fill="#4b5563">Bits of identifying information per attribute, as measured across 470,161 browsers in 2010. The status column is 2026.</text>

  <g stroke="#e5e7eb" stroke-width="1.5">
    <line x1="440" y1="112" x2="440" y2="416"/>
    <line x1="560" y1="112" x2="560" y2="416"/>
    <line x1="680" y1="112" x2="680" y2="416"/>
    <line x1="800" y1="112" x2="800" y2="416"/>
  </g>

  <text x="300" y="152" text-anchor="end" font-size="13.5" font-weight="700" fill="#111827">Plugin list</text>
  <path d="M320 130 H778 A4 4 0 0 1 782 134 V162 A4 4 0 0 1 778 166 H320 Z" fill="#0072B2"/>
  <text x="796" y="153" font-size="15" font-weight="700" fill="#111827">15.4</text>
  <text x="846" y="146" font-size="12" font-weight="700" fill="#8c1d18">NEUTRALISED</text>
  <text x="846" y="164" font-size="11.5" fill="#374151">fixed hardcoded list since Chrome 91, 2021</text>

  <text x="300" y="212" text-anchor="end" font-size="13.5" font-weight="700" fill="#111827">Font list</text>
  <path d="M320 190 H733 A4 4 0 0 1 737 194 V222 A4 4 0 0 1 733 226 H320 Z" fill="#0072B2"/>
  <text x="751" y="213" font-size="15" font-weight="700" fill="#111827">13.9</text>
  <text x="846" y="206" font-size="12" font-weight="700" fill="#00614a">STILL ACTIVE</text>
  <text x="846" y="224" font-size="11.5" fill="#374151">now the largest single contributor</text>

  <text x="300" y="272" text-anchor="end" font-size="13.5" font-weight="700" fill="#111827">User agent string</text>
  <path d="M320 250 H616 A4 4 0 0 1 620 254 V282 A4 4 0 0 1 616 286 H320 Z" fill="#0072B2"/>
  <text x="634" y="273" font-size="15" font-weight="700" fill="#111827">10.0</text>
  <text x="846" y="266" font-size="12" font-weight="700" fill="#8a6000">REDUCED</text>
  <text x="846" y="284" font-size="11.5" fill="#374151">frozen in 2023, detail moved to client hints</text>

  <text x="300" y="332" text-anchor="end" font-size="13.5" font-weight="700" fill="#111827">Screen size and colour depth</text>
  <path d="M320 310 H461 A4 4 0 0 1 465 314 V342 A4 4 0 0 1 461 346 H320 Z" fill="#0072B2"/>
  <text x="479" y="333" font-size="15" font-weight="700" fill="#111827">4.83</text>
  <text x="846" y="326" font-size="12" font-weight="700" fill="#00614a">STILL ACTIVE</text>
  <text x="846" y="344" font-size="11.5" fill="#374151">rounded only by resistance modes</text>

  <text x="300" y="392" text-anchor="end" font-size="13.5" font-weight="700" fill="#111827">Time zone</text>
  <path d="M320 370 H407 A4 4 0 0 1 411 374 V402 A4 4 0 0 1 407 406 H320 Z" fill="#0072B2"/>
  <text x="425" y="393" font-size="15" font-weight="700" fill="#111827">3.04</text>
  <text x="846" y="386" font-size="12" font-weight="700" fill="#00614a">STILL ACTIVE</text>
  <text x="846" y="404" font-size="11.5" fill="#374151">forced to one value by resistance modes</text>

  <line x1="320" y1="418" x2="800" y2="418" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="320" y="438">0</text>
    <text x="440" y="438">4</text>
    <text x="560" y="438">8</text>
    <text x="680" y="438">12</text>
    <text x="800" y="438">16</text>
  </g>
  <text x="560" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#111827" letter-spacing="0.5">BITS OF ENTROPY, AS MEASURED IN 2010</text>

  <rect x="40" y="486" width="1060" height="118" rx="10" fill="#374151" fill-opacity="0.07" stroke="#374151" stroke-width="2"/>
  <text x="66" y="516" font-size="14.5" font-weight="700" fill="#111827">The entropy did not go away. It moved.</text>
  <text x="66" y="542" font-size="12.5" fill="#374151">The single most identifying attribute in the classic study now contributes nothing, because every browser reports the same fixed plugin list. The user agent was</text>
  <text x="66" y="562" font-size="12.5" fill="#374151">frozen, and the device detail it used to carry is now available through client hints, which a site has to ask for. Meanwhile canvas and graphics rendering, which</text>
  <text x="66" y="582" font-size="12.5" fill="#374151">are not in this chart at all, grew into the gap. When you read an old attribute list, check which entries still work before you plan a defense around them.</text>
</svg>
