<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" role="img" aria-labelledby="wp-title wp-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="wp-title">Figure 1. Where the plaintext exists, in three architectures</title>
  <desc id="wp-desc">Three architectures compared by one question: who holds the key that can decrypt. With transport encryption the server holds it and the plaintext exists on the server. With vendor-held keys the message is stored encrypted but the vendor can decrypt on demand. With end-to-end encryption only the two devices hold keys and the server never has plaintext. A band below gives the test question and the marketing phrases that fail to answer it.</desc>

  <rect x="0" y="0" width="1180" height="700" fill="#ffffff"/>

  <text x="590" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Figure 1: One Question Separates These Three</text>
  <text x="590" y="72" text-anchor="middle" font-size="14.5" fill="#4b5563">Not whether it is encrypted. Everything is encrypted. The question is who holds a key that can undo it.</text>

  <rect x="30" y="104" width="360" height="336" rx="10" fill="#b3261e" fill-opacity="0.08" stroke="#b3261e" stroke-width="2.5"/>
  <path d="M30 114 a10 10 0 0 1 10 -10 h340 a10 10 0 0 1 10 10 v38 h-360 z" fill="#b3261e"/>
  <text x="210" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">TRANSPORT ENCRYPTION</text>
  <text x="210" y="146" text-anchor="middle" font-size="11.5" fill="#ffffff">most mail, most chat, most of everything</text>

  <g font-size="12.5" fill="#374151">
    <text x="52" y="180" font-weight="700" fill="#8c1d18">Key holder: the server</text>
    <text x="52" y="212">You to server</text><text x="250" y="212" font-weight="700" fill="#00614a">encrypted</text>
    <text x="52" y="238">On the server</text><text x="250" y="238" font-weight="700" fill="#8c1d18">plaintext</text>
    <text x="52" y="264">Server to them</text><text x="250" y="264" font-weight="700" fill="#00614a">encrypted</text>
  </g>
  <line x1="52" y1="286" x2="368" y2="286" stroke="#b3261e" stroke-opacity="0.4" stroke-width="1.5"/>
  <g font-size="12" fill="#374151">
    <text x="52" y="312" font-weight="700">Subpoena arrives</text>
    <text x="52" y="332">The provider hands over readable messages.</text>
    <text x="52" y="360" font-weight="700">Server is breached</text>
    <text x="52" y="380">The attacker reads everything.</text>
    <text x="52" y="410" font-style="italic" fill="#8c1d18">Protects you from the network.</text>
    <text x="52" y="428" font-style="italic" fill="#8c1d18">Not from the provider.</text>
  </g>

  <rect x="410" y="104" width="360" height="336" rx="10" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="2.5" stroke-dasharray="9 6"/>
  <path d="M410 114 a10 10 0 0 1 10 -10 h340 a10 10 0 0 1 10 10 v38 h-360 z" fill="#E69F00"/>
  <text x="590" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">VENDOR HOLDS THE KEYS</text>
  <text x="590" y="146" text-anchor="middle" font-size="11.5" fill="#ffffff">the one that sounds like the third column</text>

  <g font-size="12.5" fill="#374151">
    <text x="432" y="180" font-weight="700" fill="#8a6000">Key holder: the vendor</text>
    <text x="432" y="212">You to server</text><text x="630" y="212" font-weight="700" fill="#00614a">encrypted</text>
    <text x="432" y="238">On the server</text><text x="630" y="238" font-weight="700" fill="#8a6000">encrypted</text>
    <text x="432" y="264">Vendor can decrypt</text><text x="630" y="264" font-weight="700" fill="#8c1d18">yes</text>
  </g>
  <line x1="432" y1="286" x2="748" y2="286" stroke="#E69F00" stroke-opacity="0.6" stroke-width="1.5"/>
  <g font-size="12" fill="#374151">
    <text x="432" y="312" font-weight="700">Subpoena arrives</text>
    <text x="432" y="332">The vendor decrypts and hands it over.</text>
    <text x="432" y="360" font-weight="700">Server is breached</text>
    <text x="432" y="380">Depends entirely on where the keys were.</text>
    <text x="432" y="410" font-style="italic" fill="#8a6000">Better than nothing against a thief.</text>
    <text x="432" y="428" font-style="italic" fill="#8a6000">Worth nothing against the vendor.</text>
  </g>

  <rect x="790" y="104" width="360" height="336" rx="10" fill="#009E73" fill-opacity="0.10" stroke="#009E73" stroke-width="2.5"/>
  <path d="M790 114 a10 10 0 0 1 10 -10 h340 a10 10 0 0 1 10 10 v38 h-360 z" fill="#009E73"/>
  <text x="970" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">END TO END ENCRYPTION</text>
  <text x="970" y="146" text-anchor="middle" font-size="11.5" fill="#ffffff">keys never leave the two devices</text>

  <g font-size="12.5" fill="#374151">
    <text x="812" y="180" font-weight="700" fill="#00614a">Key holder: the two of you</text>
    <text x="812" y="212">You to server</text><text x="1010" y="212" font-weight="700" fill="#00614a">encrypted</text>
    <text x="812" y="238">On the server</text><text x="1010" y="238" font-weight="700" fill="#00614a">encrypted</text>
    <text x="812" y="264">Server can decrypt</text><text x="1010" y="264" font-weight="700" fill="#00614a">no</text>
  </g>
  <line x1="812" y1="286" x2="1128" y2="286" stroke="#009E73" stroke-opacity="0.5" stroke-width="1.5"/>
  <g font-size="12" fill="#374151">
    <text x="812" y="312" font-weight="700">Subpoena arrives</text>
    <text x="812" y="332">The provider gives up what it has, which is</text>
    <text x="812" y="350">metadata. See Figure 2.</text>
    <text x="812" y="378" font-weight="700">Server is breached</text>
    <text x="812" y="398">The attacker gets ciphertext.</text>
    <text x="812" y="426" font-style="italic" fill="#00614a">Content protected. Not everything.</text>
  </g>

  <rect x="30" y="464" width="1120" height="90" rx="10" fill="#374151" fill-opacity="0.07" stroke="#374151" stroke-width="2"/>
  <text x="56" y="494" font-size="15" font-weight="700" fill="#111827">The one question to ask a vendor: if I lose my password, can you restore my messages?</text>
  <text x="56" y="520" font-size="12.5" fill="#374151">If the answer is yes, they hold a key, and you are in the middle column. There is no way to be in the right-hand column and also able to recover somebody's</text>
  <text x="56" y="540" font-size="12.5" fill="#374151">content for them. A recovery feature is not a customer service decision. It is an architecture disclosure.</text>

  <rect x="30" y="576" width="1120" height="98" rx="10" fill="#b3261e" fill-opacity="0.06" stroke="#b3261e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="56" y="606" font-size="14.5" font-weight="700" fill="#8c1d18">Phrases that answer a different question than the one you asked</text>
  <g font-size="12.5" fill="#374151">
    <text x="56" y="632">"Bank-grade encryption" and "military-grade encryption" describe an algorithm, and every column above can use the same algorithm.</text>
    <text x="56" y="652">"Encrypted at rest" is the middle column stated positively. "Encrypted in transit" is the left column. Neither one names a key holder,</text>
    <text x="56" y="668">and naming the key holder is the only thing that distinguishes these three.</text>
  </g>
</svg>
