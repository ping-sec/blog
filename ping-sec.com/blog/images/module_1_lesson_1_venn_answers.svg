<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1190" width="1050" height="1190" role="img" aria-labelledby="venn-title venn-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="venn-title">Figure 1a. Answer key for the Venn diagram of security, privacy, and anonymity</title>
  <desc id="venn-desc">The same three overlapping circles labeled Security, Privacy, and Anonymity, with the three two-circle overlap regions filled in. Security and privacy without anonymity holds an encrypted password vault. Security and anonymity without privacy holds a pseudonymous account on a platform that harvests data. Privacy and anonymity without security holds a form sent over Tor to a plain HTTP site.</desc>

  <rect x="0" y="0" width="1050" height="1190" fill="#ffffff"/>

  <!-- Heading -->
  <text x="525" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Figure 1a: Three Different Problems, Answer Key</text>
  <text x="525" y="72" text-anchor="middle" font-size="14.5" fill="#4b5563">The same diagram with the three two-circle regions filled in. Other answers are correct.</text>

  <!-- Stroke-style key, so the three sets are told apart without color -->
  <g font-size="12.5" fill="#374151">
    <line x1="330" y1="106" x2="372" y2="106" stroke="#0072B2" stroke-width="3.5"/>
    <text x="379" y="110">Security, solid</text>
    <line x1="470" y1="106" x2="512" y2="106" stroke="#E69F00" stroke-width="3.5" stroke-dasharray="11 7"/>
    <text x="519" y="110">Privacy, dashed</text>
    <line x1="615" y1="106" x2="657" y2="106" stroke="#009E73" stroke-width="3.5" stroke-dasharray="1 7" stroke-linecap="round"/>
    <text x="664" y="110">Anonymity, dotted</text>
  </g>

  <!-- The three sets -->
  <g>
    <circle cx="400.5" cy="393.1" r="250" fill="#0072B2" fill-opacity="0.15" stroke="#0072B2" stroke-width="3.5"/>
    <circle cx="649.5" cy="393.1" r="250" fill="#E69F00" fill-opacity="0.15" stroke="#E69F00" stroke-width="3.5" stroke-dasharray="11 7"/>
    <circle cx="525" cy="608.8" r="250" fill="#009E73" fill-opacity="0.15" stroke="#009E73" stroke-width="3.5" stroke-dasharray="1 7" stroke-linecap="round"/>
  </g>

  <!-- Region 1: Security only -->
  <g text-anchor="middle" fill="#111827">
    <text x="286.6" y="298" font-size="17" font-weight="700" letter-spacing="0.6">SECURITY</text>
    <text x="286.6" y="324" font-size="12.5" font-weight="700">Encrypted mass surveillance.</text>
    <text x="286.6" y="342" font-size="12.5">The traffic is protected. The</text>
    <text x="286.6" y="359" font-size="12.5">government still knows who</text>
    <text x="286.6" y="376" font-size="12.5">speaks to whom.</text>
  </g>

  <!-- Region 2: Privacy only -->
  <g text-anchor="middle" fill="#111827">
    <text x="763.4" y="298" font-size="17" font-weight="700" letter-spacing="0.6">PRIVACY</text>
    <text x="763.4" y="324" font-size="12.5" font-weight="700">A postcard.</text>
    <text x="763.4" y="342" font-size="12.5">Convention protects it. Each</text>
    <text x="763.4" y="359" font-size="12.5">person who handles it can</text>
    <text x="763.4" y="376" font-size="12.5">read it.</text>
  </g>

  <!-- Region 3: Anonymity only -->
  <g text-anchor="middle" fill="#111827">
    <text x="525" y="660" font-size="17" font-weight="700" letter-spacing="0.6">ANONYMITY</text>
    <text x="525" y="686" font-size="12.5" font-weight="700">A forum post from open cafe Wi-Fi.</text>
    <text x="525" y="704" font-size="12.5">The forum does not know you.</text>
    <text x="525" y="721" font-size="12.5">The network sees everything.</text>
  </g>

  <!-- Region 4: Security and privacy, no anonymity -->
  <g text-anchor="middle" fill="#111827">
    <text x="525" y="258" font-size="11.5" font-weight="700">An encrypted</text>
    <text x="525" y="274" font-size="11.5" font-weight="700">password vault.</text>
    <text x="525" y="292" font-size="11" fill="#374151">Your name is</text>
    <text x="525" y="307" font-size="11" fill="#374151">on the account.</text>
  </g>

  <!-- Region 5: Security and anonymity, no privacy -->
  <g text-anchor="middle" fill="#111827">
    <text x="361.8" y="500" font-size="11.5" font-weight="700">A pseudonym</text>
    <text x="361.8" y="516" font-size="11.5" font-weight="700">on a tracker.</text>
    <text x="361.8" y="534" font-size="11" fill="#374151">It records</text>
    <text x="361.8" y="549" font-size="11" fill="#374151">every action.</text>
  </g>

  <!-- Region 6: Privacy and anonymity, no security -->
  <g text-anchor="middle" fill="#111827">
    <text x="688.2" y="500" font-size="11.5" font-weight="700">Tor to a plain</text>
    <text x="688.2" y="516" font-size="11.5" font-weight="700">HTTP site.</text>
    <text x="688.2" y="534" font-size="11" fill="#374151">The exit node</text>
    <text x="688.2" y="549" font-size="11" fill="#374151">reads it.</text>
  </g>

  <!-- Region 7: the center, all three -->
  <g text-anchor="middle" fill="#111827">
    <text x="525" y="438" font-size="13" font-weight="700" letter-spacing="0.3">THE OBJECTIVE OF</text>
    <text x="525" y="456" font-size="13" font-weight="700" letter-spacing="0.3">THIS COURSE</text>
    <text x="525" y="476" font-size="11.5" fill="#374151">All three, in layers,</text>
    <text x="525" y="491" font-size="11.5" fill="#374151">and by intention.</text>
  </g>

  <!-- Key -->
  <line x1="110" y1="898" x2="940" y2="898" stroke="#d1d5db" stroke-width="1"/>
  <g fill="#374151" font-size="13.5">
    <text x="110" y="928"><tspan font-weight="700" fill="#111827">Figure 1a.</tspan> One possible answer for each of the three regions that Figure 1 leaves empty.</text>
    <text x="110" y="948">More than one answer is correct.</text>

    <text x="110" y="984"><tspan font-weight="700" fill="#111827">Security and privacy, without anonymity.</tspan> An encrypted password vault. The vendor</text>
    <text x="110" y="1004">holds ciphertext only and cannot read your data. The account is registered in your name.</text>

    <text x="110" y="1040"><tspan font-weight="700" fill="#111827">Security and anonymity, without privacy.</tspan> A pseudonymous account on a platform that</text>
    <text x="110" y="1060">harvests data. The platform does not know your name. It still records each action that you</text>
    <text x="110" y="1080">take, and a full behavior profile can identify you later.</text>

    <text x="110" y="1116"><tspan font-weight="700" fill="#111827">Privacy and anonymity, without security.</tspan> A form sent over Tor to a plain HTTP site. The</text>
    <text x="110" y="1136">site does not know you, and you send only what you select. The exit node reads the data</text>
    <text x="110" y="1156">and can change it.</text>
  </g>
</svg>
