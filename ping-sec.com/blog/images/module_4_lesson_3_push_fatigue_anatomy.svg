<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-labelledby="pf-title pf-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="pf-title">Figure 3. The push fatigue attack, including the step usually left out</title>
  <desc id="pf-desc">A four step reconstruction of the 2022 contractor breach. The attacker already held the password. Approval requests were sent repeatedly, roughly forty in thirty minutes. Then the attacker contacted the target on a separate messaging channel, posing as internal support, and said approving one request would stop the alerts. The target approved once, and that single approval led to wider access. Two panels below explain why the standard advice to never approve an unrecognised request does not hold, because by the third step the request has been explained to the target, and what number matching does and does not change.</desc>

  <rect x="0" y="0" width="1180" height="720" fill="#ffffff"/>

  <text x="590" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Figure 3: Push Fatigue, Including the Step Usually Left Out</text>
  <text x="590" y="72" text-anchor="middle" font-size="14.5" fill="#4b5563">The 2022 case is told as a story about somebody who got annoyed and gave in. That telling removes the part that made it work.</text>

  <rect x="30" y="104" width="259" height="212" rx="10" fill="#374151" fill-opacity="0.08" stroke="#374151" stroke-width="2"/>
  <circle cx="62" cy="136" r="15" fill="#374151"/><text x="62" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="88" y="142" font-size="13" font-weight="700" fill="#111827">They have the password</text>
  <g font-size="11.5" fill="#374151">
    <text x="50" y="180">Bought, or taken from an</text>
    <text x="50" y="198">earlier breach, or lifted by</text>
    <text x="50" y="216">malware on another machine.</text>
    <text x="50" y="244" font-weight="700">The attack begins after the</text>
    <text x="50" y="262" font-weight="700">first factor has already</text>
    <text x="50" y="280" font-weight="700">failed, which is the whole</text>
    <text x="50" y="298" font-weight="700">reason a second one exists.</text>
  </g>

  <path d="M293 210 h20" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#374151"/></marker></defs>

  <rect x="317" y="104" width="259" height="212" rx="10" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="2"/>
  <circle cx="349" cy="136" r="15" fill="#b07b00"/><text x="349" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="375" y="142" font-size="13" font-weight="700" fill="#8a6000">The requests begin</text>
  <g font-size="11.5" fill="#374151">
    <text x="337" y="180">Each sign in attempt sends an</text>
    <text x="337" y="198">approval request to the phone.</text>
    <text x="337" y="222" font-weight="700" fill="#8a6000">Roughly forty of them in</text>
    <text x="337" y="240" font-weight="700" fill="#8a6000">thirty minutes.</text>
    <text x="337" y="268">On its own this usually fails.</text>
    <text x="337" y="286">Most people ignore it, and</text>
    <text x="337" y="304">some report it.</text>
  </g>

  <path d="M580 210 h20" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <rect x="604" y="104" width="259" height="212" rx="10" fill="#b3261e" fill-opacity="0.10" stroke="#b3261e" stroke-width="2.5"/>
  <circle cx="636" cy="136" r="15" fill="#b3261e"/><text x="636" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="662" y="142" font-size="13" font-weight="700" fill="#8c1d18">A message arrives</text>
  <g font-size="11.5" fill="#374151">
    <text x="624" y="180">On a different channel. The</text>
    <text x="624" y="198">attacker says they are</text>
    <text x="624" y="216">internal support, the alerts</text>
    <text x="624" y="234">are a known fault, and</text>
    <text x="624" y="252">approving one will stop them.</text>
    <text x="624" y="280" font-weight="700" fill="#8c1d18">This is the step that is</text>
    <text x="624" y="298" font-weight="700" fill="#8c1d18">missing from most retellings.</text>
  </g>

  <path d="M867 210 h20" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <rect x="891" y="104" width="259" height="212" rx="10" fill="#b3261e" fill-opacity="0.10" stroke="#b3261e" stroke-width="2.5"/>
  <circle cx="923" cy="136" r="15" fill="#b3261e"/><text x="923" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="949" y="142" font-size="13" font-weight="700" fill="#8c1d18">One approval</text>
  <g font-size="11.5" fill="#374151">
    <text x="911" y="180">A contractor account, which</text>
    <text x="911" y="198">then reached internal tools</text>
    <text x="911" y="216">and further credentials.</text>
    <text x="911" y="244" font-weight="700" fill="#8c1d18">The person who approved was</text>
    <text x="911" y="262" font-weight="700" fill="#8c1d18">not careless. They were</text>
    <text x="911" y="280" font-weight="700" fill="#8c1d18">given an explanation that</text>
    <text x="911" y="298" font-weight="700" fill="#8c1d18">fitted what they could see.</text>
  </g>

  <rect x="30" y="348" width="550" height="206" rx="10" fill="#b3261e" fill-opacity="0.07" stroke="#b3261e" stroke-width="2.5"/>
  <text x="52" y="378" font-size="15" font-weight="700" fill="#8c1d18">Why "never approve an unrecognised request" fails</text>
  <g font-size="12.5" fill="#374151">
    <text x="52" y="406">By step three the request is no longer unrecognised. It has</text>
    <text x="52" y="426">been explained, by somebody who appears to work there, in a</text>
    <text x="52" y="446">way that accounts for exactly what the target is seeing.</text>
    <text x="52" y="474" font-weight="700" fill="#8c1d18">The advice assumes the target has no context. The attack</text>
    <text x="52" y="494" font-weight="700" fill="#8c1d18">works by supplying context.</text>
    <text x="52" y="522">Any control that depends on a person correctly distrusting a</text>
    <text x="52" y="542">plausible message will fail on somebody, eventually.</text>
  </g>

  <rect x="600" y="348" width="550" height="206" rx="10" fill="#0072B2" fill-opacity="0.09" stroke="#0072B2" stroke-width="2.5"/>
  <text x="622" y="378" font-size="15" font-weight="700" fill="#10476b">What number matching changes, and what it does not</text>
  <g font-size="12.5" fill="#374151">
    <text x="622" y="406" font-weight="700" fill="#00614a">It closes this attack.</text>
    <text x="622" y="426">You must read a number from the screen and type it, so there</text>
    <text x="622" y="446">is no reflex to exploit. Enable it wherever it is offered.</text>
    <text x="622" y="474" font-weight="700" fill="#8c1d18">It does not make push phishing resistant.</text>
    <text x="622" y="494">A relay page shows you the number to type, and you type it.</text>
    <text x="622" y="522">National guidance describes number matching as an interim</text>
    <text x="622" y="542">mitigation for organisations that cannot yet cross the line.</text>
  </g>

  <rect x="30" y="576" width="1120" height="76" rx="10" fill="#009E73" fill-opacity="0.09" stroke="#009E73" stroke-width="2.5"/>
  <text x="56" y="604" font-size="15" font-weight="700" fill="#00614a">The reason this figure is in a lesson about your own accounts</text>
  <text x="56" y="630" font-size="12.5" fill="#374151">You will be the plausible message one day, on an engagement, and you should know why it works. And you should notice that every defence in the right hand panel</text>
  <text x="56" y="646" font-size="12.5" fill="#374151">still asks a tired person to make a correct decision, which is the property that the methods above the line in Figure 1 do not have.</text>

  <text x="590" y="694" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">Turn on number matching today. Cross the line where you can, and stop needing anybody to make the right call at eleven at night.</text>
</svg>
