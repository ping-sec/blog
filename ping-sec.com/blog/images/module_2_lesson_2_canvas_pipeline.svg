<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" role="img" aria-labelledby="cv-title cv-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="cv-title">Figure 2. How a canvas fingerprint is produced</title>
  <desc id="cv-desc">Four pipeline steps left to right: create an off-screen canvas, draw text and shapes into it, read the pixels back, and hash the result. Below, the same code run on three different systems produces three different hashes. A list gives the causes of the divergence: graphics hardware, driver version, font rasterisation and anti-aliasing, colour management, operating system text engine, and browser compositing.</desc>

  <defs>
    <marker id="cvA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="700" fill="#ffffff"/>

  <text x="580" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Figure 2: Where a Canvas Fingerprint Comes From</text>
  <text x="580" y="72" text-anchor="middle" font-size="14.5" fill="#4b5563">Nothing here is stored, nothing is displayed, and the whole sequence takes a few milliseconds.</text>

  <rect x="40" y="112" width="250" height="152" rx="10" fill="#0072B2" fill-opacity="0.10" stroke="#0072B2" stroke-width="2.5"/>
  <path d="M40 122 a10 10 0 0 1 10 -10 h230 a10 10 0 0 1 10 10 v32 h-250 z" fill="#0072B2"/>
  <text x="165" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">1. CREATE</text>
  <g font-size="12.5" fill="#374151">
    <text x="58" y="176">An off-screen canvas</text>
    <text x="58" y="196">element, never added</text>
    <text x="58" y="216">to the visible page.</text>
    <text x="58" y="244" font-weight="700" fill="#10476b">You see nothing.</text>
  </g>

  <rect x="320" y="112" width="250" height="152" rx="10" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="2.5"/>
  <path d="M320 122 a10 10 0 0 1 10 -10 h230 a10 10 0 0 1 10 10 v32 h-250 z" fill="#56B4E9"/>
  <text x="445" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">2. DRAW</text>
  <g font-size="12.5" fill="#374151">
    <text x="338" y="176">Text in a named font,</text>
    <text x="338" y="196">a font that does not</text>
    <text x="338" y="216">exist, an emoji, and a</text>
    <text x="338" y="236">few coloured shapes.</text>
    <text x="338" y="258" font-weight="700" fill="#1f5f7f">Complexity is deliberate.</text>
  </g>

  <rect x="600" y="112" width="250" height="152" rx="10" fill="#E69F00" fill-opacity="0.14" stroke="#E69F00" stroke-width="2.5"/>
  <path d="M600 122 a10 10 0 0 1 10 -10 h230 a10 10 0 0 1 10 10 v32 h-250 z" fill="#E69F00"/>
  <text x="725" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">3. READ BACK</text>
  <g font-size="12.5" fill="#374151">
    <text x="618" y="176">Export the pixels, as</text>
    <text x="618" y="196">an image or as raw</text>
    <text x="618" y="216">values.</text>
    <text x="618" y="244" font-weight="700" fill="#8a6000">This is the step that</text>
    <text x="618" y="262" font-weight="700" fill="#8a6000">defenses intercept.</text>
  </g>

  <rect x="880" y="112" width="240" height="152" rx="10" fill="#009E73" fill-opacity="0.13" stroke="#009E73" stroke-width="2.5"/>
  <path d="M880 122 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v32 h-240 z" fill="#009E73"/>
  <text x="1000" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">4. HASH</text>
  <g font-size="12.5" fill="#374151">
    <text x="898" y="176">Reduce the pixels to</text>
    <text x="898" y="196">a short value and</text>
    <text x="898" y="216">send it onward.</text>
    <text x="898" y="244" font-weight="700" fill="#00614a">Stable across sessions,</text>
    <text x="898" y="262" font-weight="700" fill="#00614a">because hardware is.</text>
  </g>

  <g stroke="#374151" stroke-width="2.5" marker-end="url(#cvA)">
    <line x1="294" y1="188" x2="312" y2="188"/>
    <line x1="574" y1="188" x2="592" y2="188"/>
    <line x1="854" y1="188" x2="872" y2="188"/>
  </g>

  <text x="580" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">The same four steps, the same code, three machines</text>

  <rect x="90" y="336" width="300" height="112" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="240" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">System A</text>
  <text x="240" y="388" text-anchor="middle" font-size="12" fill="#6b7280">text edges antialiased one way</text>
  <text x="240" y="424" text-anchor="middle" font-size="17" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#111827">a3f8e29c</text>

  <rect x="430" y="336" width="300" height="112" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="580" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">System B</text>
  <text x="580" y="388" text-anchor="middle" font-size="12" fill="#6b7280">emoji drawn from a different set</text>
  <text x="580" y="424" text-anchor="middle" font-size="17" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#111827">b7d4f1a8</text>

  <rect x="770" y="336" width="300" height="112" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="920" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">System C</text>
  <text x="920" y="388" text-anchor="middle" font-size="12" fill="#6b7280">missing font falls back elsewhere</text>
  <text x="920" y="424" text-anchor="middle" font-size="17" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#111827">c9e2b5f3</text>

  <rect x="40" y="482" width="1080" height="122" rx="10" fill="#E69F00" fill-opacity="0.08" stroke="#E69F00" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="66" y="512" font-size="14.5" font-weight="700" fill="#8a6000">Six things make the pixels differ, and you control almost none of them</text>
  <g font-size="12.5" fill="#374151">
    <circle cx="74" cy="538" r="3.5" fill="#b07b00"/><text x="88" y="542">Graphics hardware and its model</text>
    <circle cx="74" cy="562" r="3.5" fill="#b07b00"/><text x="88" y="566">Graphics driver version</text>
    <circle cx="74" cy="586" r="3.5" fill="#b07b00"/><text x="88" y="590">Font rasterisation, hinting and anti-aliasing</text>
    <circle cx="600" cy="538" r="3.5" fill="#b07b00"/><text x="614" y="542">Colour management and gamma handling</text>
    <circle cx="600" cy="562" r="3.5" fill="#b07b00"/><text x="614" y="566">The operating system text engine and its system fonts</text>
    <circle cx="600" cy="586" r="3.5" fill="#b07b00"/><text x="614" y="590">Browser compositing and its canvas implementation</text>
  </g>

  <text x="580" y="646" text-anchor="middle" font-size="13.5" fill="#4b5563">Every one of those is a property of your machine, not of your session. That is why clearing storage changes nothing here,</text>
  <text x="580" y="668" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">and why the only defenses that work operate on step 3 or replace the machine.</text>
</svg>
