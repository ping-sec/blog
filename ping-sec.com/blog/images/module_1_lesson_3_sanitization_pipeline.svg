<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="1140" height="620" role="img" aria-labelledby="pipe-title pipe-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="pipe-title">Figure 3. The metadata sanitization pipeline</title>
  <desc id="pipe-desc">Four steps left to right: create in a clean environment, strip with the correct tool for the format, verify with a second tool, and publish only the verified copy. A band below names the two points where the pipeline usually fails: format conversion and archiving, because both write new metadata after the strip step.</desc>

  <defs>
    <marker id="rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="620" fill="#ffffff"/>

  <text x="570" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Figure 3: Strip, Then Verify, Then Publish</text>
  <text x="570" y="72" text-anchor="middle" font-size="14.5" fill="#4b5563">Step 3 is the step that people skip. Step 3 is the only one that proves anything.</text>

  <!-- Step 1 -->
  <rect x="45" y="112" width="235" height="212" rx="10" fill="#0072B2" fill-opacity="0.10" stroke="#0072B2" stroke-width="2.5"/>
  <path d="M45 122 a10 10 0 0 1 10 -10 h215 a10 10 0 0 1 10 10 v32 h-235 z" fill="#0072B2"/>
  <text x="162" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">1. CREATE</text>
  <g font-size="12.5" fill="#374151">
    <text x="63" y="180">Author in the environment</text>
    <text x="63" y="200">that matches the layer.</text>
    <text x="63" y="228">Prefer plain text or</text>
    <text x="63" y="248">markdown. They carry</text>
    <text x="63" y="268">almost no metadata.</text>
    <text x="63" y="296">Set no real name in the</text>
    <text x="63" y="316">tool profile.</text>
  </g>

  <!-- Step 2 -->
  <rect x="320" y="112" width="235" height="212" rx="10" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="2.5"/>
  <path d="M320 122 a10 10 0 0 1 10 -10 h215 a10 10 0 0 1 10 10 v32 h-235 z" fill="#56B4E9"/>
  <text x="437" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">2. STRIP</text>
  <g font-size="12.5" fill="#374151">
    <text x="338" y="180">Use the correct tool for</text>
    <text x="338" y="200">the format.</text>
    <text x="338" y="228" font-family="Consolas, Menlo, monospace" fill="#111827">mat2</text><text x="384" y="228">office and</text>
    <text x="338" y="248">open document files</text>
    <text x="338" y="272" font-family="Consolas, Menlo, monospace" fill="#111827">exiftool</text><text x="404" y="272">images</text>
    <text x="338" y="296" font-family="Consolas, Menlo, monospace" fill="#111827">qpdf</text><text x="380" y="296">PDF files</text>
  </g>

  <!-- Step 3 -->
  <rect x="595" y="112" width="235" height="212" rx="10" fill="#E69F00" fill-opacity="0.16" stroke="#E69F00" stroke-width="3"/>
  <path d="M595 122 a10 10 0 0 1 10 -10 h215 a10 10 0 0 1 10 10 v32 h-235 z" fill="#E69F00"/>
  <text x="712" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">3. VERIFY</text>
  <g font-size="12.5" fill="#374151">
    <text x="613" y="180">Read the file again, with</text>
    <text x="613" y="200">a different tool than the</text>
    <text x="613" y="220">one that stripped it.</text>
    <text x="613" y="248">A tool cannot always</text>
    <text x="613" y="268">report what it failed</text>
    <text x="613" y="288">to remove.</text>
    <text x="613" y="316" font-weight="700" fill="#8a6000">Never skip this step.</text>
  </g>

  <!-- Step 4 -->
  <rect x="870" y="112" width="235" height="212" rx="10" fill="#009E73" fill-opacity="0.14" stroke="#009E73" stroke-width="2.5"/>
  <path d="M870 122 a10 10 0 0 1 10 -10 h215 a10 10 0 0 1 10 10 v32 h-235 z" fill="#009E73"/>
  <text x="987" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">4. PUBLISH</text>
  <g font-size="12.5" fill="#374151">
    <text x="888" y="180">Release the verified copy</text>
    <text x="888" y="200">only.</text>
    <text x="888" y="228">Keep the original in the</text>
    <text x="888" y="248">professional layer, where</text>
    <text x="888" y="268">the client contract</text>
    <text x="888" y="288">already covers it.</text>
  </g>

  <g stroke="#374151" stroke-width="2.5" marker-end="url(#rt)">
    <line x1="284" y1="218" x2="312" y2="218"/>
    <line x1="559" y1="218" x2="587" y2="218"/>
    <line x1="834" y1="218" x2="862" y2="218"/>
  </g>

  <!-- Failure band -->
  <rect x="45" y="366" width="1060" height="150" rx="10" fill="#b3261e" fill-opacity="0.07" stroke="#b3261e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="70" y="398" font-size="15" font-weight="700" fill="#8c1d18">Two ways this pipeline fails, and both happen after step 2</text>

  <text x="70" y="432" font-size="13.5" font-weight="700" fill="#111827">Format conversion writes new metadata.</text>
  <text x="70" y="456" font-size="12.5" fill="#374151">A clean document converted to PDF gets a fresh set of fields</text>
  <text x="70" y="478" font-size="12.5" fill="#374151">from the converter, and it can carry source fields across.</text>
  <text x="70" y="500" font-size="12.5" font-weight="700" fill="#8c1d18">Sanitize after the conversion, never before it.</text>

  <text x="610" y="432" font-size="13.5" font-weight="700" fill="#111827">Archiving preserves what you removed.</text>
  <text x="610" y="456" font-size="12.5" fill="#374151">A zip file records the path and the modification time of every</text>
  <text x="610" y="478" font-size="12.5" fill="#374151">member, so clean files inside a dirty archive still leak.</text>
  <text x="610" y="500" font-size="12.5" font-weight="700" fill="#8c1d18">Check the archive itself, not only its contents.</text>

  <text x="570" y="566" text-anchor="middle" font-size="13.5" font-style="italic" fill="#4b5563">A file is sanitized when you have read it and confirmed that. It is not sanitized because you ran a command against it.</text>
</svg>
